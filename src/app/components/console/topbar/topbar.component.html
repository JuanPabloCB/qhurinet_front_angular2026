<div class="topbar">
  <div>
    <div class="page-title">{{ store.pageTitle() }}</div>
    <div class="page-meta">{{ store.pageMeta() }}</div>
  </div>
  <div class="grow"></div>

  <div class="search">
    <svg viewBox="0 0 24 24" class="search-icon">
      <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"></circle>
      <path d="M15.5 15.5 L21 21" stroke="currentColor" stroke-width="2"></path>
    </svg>
    <input
      type="text"
      aria-label="Buscar"
      placeholder="Buscar"
      [value]="store.search()"
      (input)="store.onSearch($any($event.target).value)"
      class="search-input"
    />
  </div>

  <div class="notif-wrap">
    <button
      type="button"
      class="flow-button notif-button"
      aria-label="Notificaciones"
      [attr.aria-expanded]="store.notifOpen()"
      (click)="store.toggleNotif()"
    >
      <svg viewBox="0 0 24 24" class="notif-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 16 V11 A6 6 0 0 1 18 11 V16 L19.5 18 H4.5 Z"></path>
        <path d="M10 20 A2 2 0 0 0 14 20"></path>
      </svg>
      @if (store.hasUnread()) {
        <span class="notif-badge" [attr.aria-label]="store.unreadCount() + ' sin leer'">{{ store.unreadCount() }}</span>
      }
    </button>

    @if (store.notifOpen()) {
      <div role="region" aria-label="Notificaciones" class="notif-panel" (keydown.escape)="store.closeNotif()">
        <div class="notif-head">
          <div>
            <div class="notif-head-title">Notificaciones</div>
            <div class="notif-head-sub">{{ store.unreadCount() }} SIN LEER</div>
          </div>
          <div class="grow"></div>
          <button type="button" class="flow-button notif-small" (click)="store.markAllRead()" [disabled]="store.allRead()">Marcar todas</button>
          <button type="button" class="flow-button notif-close" aria-label="Cerrar notificaciones" (click)="store.closeNotif()">×</button>
        </div>
        <div class="notif-list">
          @for (n of store.notificationsView(); track n.id) {
            <div class="notif-item" [style.background]="n.bg">
              <div class="notif-dot" [style.background]="n.dot"></div>
              <div class="notif-body">
                <div class="notif-row">
                  <div class="notif-title" [style.font-weight]="n.weight">{{ n.title }}</div>
                  <div class="notif-time">{{ n.time }}</div>
                </div>
                <div class="notif-text">{{ n.text }}</div>
                @if (n.unread) {
                  <button type="button" class="flow-button notif-mark" (click)="store.markRead(n.id)">Marcar como leída</button>
                }
              </div>
            </div>
          }
        </div>
      </div>
    }
  </div>

  <div class="status">
    <div class="status-dot"></div>
    {{ store.statusLabel() }}
  </div>
</div>
