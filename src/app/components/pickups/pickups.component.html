<div style="padding: 24px 28px 48px; display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start;">

  <app-delivery-table
    mode="recojos"
    [rows]="store.pickups()"
    [activeCount]="store.activePickups()"
    [completedText]="'' + store.completedPickups()"
    [canceledCount]="store.canceledPickups()"
  />

  <div style="display: flex; flex-direction: column; gap: 20px;">
    <div style="background: #ffffff; border: 1px solid #e2e5dc; border-radius: 14px; padding: 20px;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #6c7a6e;">RESUMEN DEL MES</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px;">
        <div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600;">177,6</div><div style="font-size: 11px; color: #5d6b5f; margin-top: 3px;">kg recuperados</div></div>
        <div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600;">30</div><div style="font-size: 11px; color: #5d6b5f; margin-top: 3px;">recojos</div></div>
        <div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600;">4.9</div><div style="font-size: 11px; color: #5d6b5f; margin-top: 3px;">valoración</div></div>
        <div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600;">98%</div><div style="font-size: 11px; color: #5d6b5f; margin-top: 3px;">cumplimiento</div></div>
      </div>
      <div style="height: 1px; background: #eceee7; margin: 18px 0 14px;"></div>
      <div style="font-size: 11px; color: #5d6b5f;">Meta mensual 200 kg</div>
      <div style="height: 7px; background: #eceee7; border-radius: 4px; margin-top: 8px; overflow: hidden;"><div style="width: 89%; height: 100%; background: #a3d24a;"></div></div>
      <div style="display: flex; justify-content: flex-end; font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: 6px;">89%</div>
    </div>

    <div style="background: #ffffff; border: 1px solid #e2e5dc; border-radius: 14px; padding: 20px;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #6c7a6e;">MATERIALES DEL MES</div>
      <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 16px;">
        <div><div style="display: flex; justify-content: space-between; font-size: 12px;"><div>Plástico</div><div style="font-family: 'IBM Plex Mono', monospace;">18,0 kg</div></div><div style="height: 6px; background: #eceee7; border-radius: 3px; margin-top: 6px; overflow: hidden;"><div style="width: 36%; height: 100%; background: #4c7a2f;"></div></div></div>
        <div><div style="display: flex; justify-content: space-between; font-size: 12px;"><div>Papel y cartón</div><div style="font-family: 'IBM Plex Mono', monospace;">12,5 kg</div></div><div style="height: 6px; background: #eceee7; border-radius: 3px; margin-top: 6px; overflow: hidden;"><div style="width: 25%; height: 100%; background: #e8b53a;"></div></div></div>
        <div><div style="display: flex; justify-content: space-between; font-size: 12px;"><div>Vidrio</div><div style="font-family: 'IBM Plex Mono', monospace;">10,0 kg</div></div><div style="height: 6px; background: #eceee7; border-radius: 3px; margin-top: 6px; overflow: hidden;"><div style="width: 20%; height: 100%; background: #5b7f9e;"></div></div></div>
        <div><div style="display: flex; justify-content: space-between; font-size: 12px;"><div>Metal</div><div style="font-family: 'IBM Plex Mono', monospace;">9,5 kg</div></div><div style="height: 6px; background: #eceee7; border-radius: 3px; margin-top: 6px; overflow: hidden;"><div style="width: 19%; height: 100%; background: #b1573f;"></div></div></div>
      </div>
    </div>
  </div>
</div>
